name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skipped == 'false'
        run: npm ci

      - name: Build & bundle installer (DML)
        if: steps.check.outputs.skipped == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:dml

      - name: Build & bundle installer (CUDA)
        if: steps.check.outputs.skipped == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:cuda

      - name: Extract release notes
        if: steps.check.outputs.skipped == 'false'
        shell: bash
        run: |
          if node scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}" .release-body.md; then
            echo "notes=file" >> "$GITHUB_OUTPUT"
          else
            echo "notes=generate" >> "$GITHUB_OUTPUT"
          fi
        id: notes

      - name: Create release
        if: steps.check.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ steps.notes.outputs.notes }}" == "file" ]]; then
            NOTES="--notes-file .release-body.md"
          else
            NOTES="--generate-notes"
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/dml/Lumina-Setup-DML-${{ steps.version.outputs.version }}.exe \
            dist/cuda/Lumina-Setup-CUDA-${{ steps.version.outputs.version }}.exe \
            dist/dml/dml.yml dist/dml/*.blockmap \
            dist/cuda/cuda.yml dist/cuda/*.blockmap \
            build/cuda-runtime.7z build/cuda-runtime.json \
            --repo "${{ github.repository }}" $NOTES \
            --title "Lumina v${{ steps.version.outputs.version }}"

  release-macos:
    needs: release-windows
    if: needs.release-windows.outputs.skipped == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS ${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LUMINA_MAC_ARCH: ${{ matrix.arch }}
        run: npm run dist:macos:${{ matrix.arch }}

      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-windows.outputs.version }}
        run: |
          gh release upload "v${VERSION}" \
            dist/macos/Lumina-${VERSION}-mac-${{ matrix.arch }}.dmg \
            dist/macos/Lumina-${VERSION}-mac-${{ matrix.arch }}.zip \
            dist/macos/macos.yml \
            dist/macos/*.blockmap \
            --repo "${{ github.repository }}" \
            --clobber
